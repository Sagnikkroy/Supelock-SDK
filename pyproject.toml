[project]
name = "supelock"
version = "0.1.0"
description = "Supelock SDK for cryptographic intent signing in automation and agents"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Sagnik Roy"}
]

dependencies = [
    "pynacl>=1.5.0",
    "httpx>=0.24.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["supelock"]
